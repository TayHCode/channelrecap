[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "channelrecap"
version = "0.1.0"
description = "Turn your own videos into transcripts and agent-ready notes: topics, gaps, filler words and new video ideas."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.2.1", "av<19"]
links = ["yt-dlp[default]"]
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12"]
all = ["faster-whisper>=1.2.1", "av<19", "yt-dlp[default]"]

[project.scripts]
channelrecap = "channelrecap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
channelrecap = ["data/*.txt", "data/*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["F401"] # helpers installs offline fixtures; some imports pin adapter APIs
